<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Point Tracker</title>
  <style>
    /* --------------------------------------------------
       Theme Definitions (CSS Variables)
    -------------------------------------------------- */

    /* Default Kid Mode Theme (Yellows/Oranges) */
    [data-theme="kid"] {
      --bg-color: #FFF8E7;
      --card-bg: #FFFFFF;
      --text-color: #2B2D42;
      --btn-bg: #FFB703;
      --btn-hover: #FB8500;
      --btn-text: #000000;
      --border-color: #FFD166;
    }

    /* Parent Mode - Abby's Theme (Pink & Red) */
    [data-theme="abby"] {
      --bg-color: #FFF0F5;      /* Soft pink background */
      --card-bg: #FFFFFF;
      --text-color: #5A1223;     /* Dark red text */
      --btn-bg: #E63946;        /* Bright red button */
      --btn-hover: #C5221F;     /* Darker red hover */
      --btn-text: #FFFFFF;
      --border-color: #FFB7C5;   /* Pink border */
    }

    /* Parent Mode - Nolan's Theme (Blue & Light Blue) */
    [data-theme="nolan"] {
      --bg-color: #E0F2FE;      /* Light blue background */
      --card-bg: #FFFFFF;
      --text-color: #0F172A;     /* Navy text */
      --btn-bg: #0284C7;        /* Blue button */
      --btn-hover: #0369A1;     /* Darker blue hover */
      --btn-text: #FFFFFF;
      --border-color: #BAE6FD;   /* Soft sky blue border */
    }

    /* --------------------------------------------------
       Layout & Basic Styling (No Fades/Transitions)
    -------------------------------------------------- */
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 2rem;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      border: 3px solid var(--border-color);
    }

    .mode-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .mode-nav button {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    .action-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.25rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      margin-top: 1rem;
    }

    .action-btn:hover {
      background-color: var(--btn-hover);
    }
  </style>
</head>
<body data-theme="kid">

  <div class="container">
    <h2>Parent Mode Controls</h2>
    
    <!-- Profile Toggle Buttons -->
    <div class="mode-nav">
      <button onclick="setProfile('abby')">Abby</button>
      <button onclick="setProfile('nolan')">Nolan</button>
      <button onclick="setProfile('kid')">Kid Mode</button>
    </div>

    <!-- Active Card Content -->
    <div class="content">
      <h3 id="active-profile-heading">Kid Mode</h3>
      <p id="description">Select Abby or Nolan to give points.</p>
      
      <button id="point-btn" class="action-btn">+1 Point</button>
    </div>
  </div>

  <script>
    function setProfile(profile) {
      // Instantly switch the data-theme attribute on <body>
      document.body.setAttribute('data-theme', profile);

      // Update text to match active theme
      const heading = document.getElementById('active-profile-heading');
      const description = document.getElementById('description');
      const pointBtn = document.getElementById('point-btn');

      if (profile === 'abby') {
        heading.textContent = "Abby's Profile";
        description.textContent = "You are currently editing Abby's points.";
        pointBtn.textContent = "+1 Point for Abby";
      } else if (profile === 'nolan') {
        heading.textContent = "Nolan's Profile";
        description.textContent = "You are currently editing Nolan's points.";
        pointBtn.textContent = "+1 Point for Nolan";
      } else {
        heading.textContent = "Kid Mode";
        description.textContent = "Select Abby or Nolan to give points.";
        pointBtn.textContent = "+1 Point";
      }
    }
  </script>

</body>
</html>
